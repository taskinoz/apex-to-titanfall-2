name: Publish Northstar maps to Thunderstore

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      selection:
        description: 'current, runtime mod name (e.g. ArenaOverflow), or locked GitHub release tag'
        default: current
        required: true
      publish:
        description: 'Publish verified packages to Thunderstore (false builds downloadable artifacts only)'
        type: boolean
        default: false
  pull_request:
    paths: ['thunderstore/**', 'thunderstore_ci.py', 'test_thunderstore_ci.py', '.github/workflows/thunderstore.yml']

permissions:
  contents: read

concurrency:
  group: thunderstore-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            thunderstore
            thunderstore_ci.py
            test_thunderstore_ci.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_thunderstore_ci

  release:
    needs: test
    if: github.repository == 'taskinoz/apex-to-titanfall-2' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHOULD_PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
    steps:
      # Publishing code/catalog always comes from main, not an old release tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            thunderstore
            thunderstore_ci.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check publishing configuration
        if: env.SHOULD_PUBLISH == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.TS_KEY }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo '::error::Add the taskinoz Thunderstore service-account token as repository secret TS_KEY.'
            exit 1
          fi
      - name: Download, verify and repackage accepted releases
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.selection }}
        run: python thunderstore_ci.py --select "$SELECTION" --output "$RUNNER_TEMP/thunderstore"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thunderstore-packages-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/thunderstore/*/*.zip
            ${{ runner.temp }}/thunderstore/receipts.json
          compression-level: 0
          retention-days: 7
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: env.SHOULD_PUBLISH == 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Install official pinned Thunderstore CLI
        if: env.SHOULD_PUBLISH == 'true'
        run: dotnet tool install --global tcli --version 0.2.4
      - name: Publish UI dependency first, then maps
        if: env.SHOULD_PUBLISH == 'true'
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TS_KEY }}
        run: python thunderstore_ci.py --output "$RUNNER_TEMP/thunderstore" --publish
